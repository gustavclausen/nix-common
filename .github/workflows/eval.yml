name: eval

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    # GitHub-hosted runners only; never a self-hosted runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Flake check
        run: nix flake check
      - name: Evaluate sample standalone Home Manager configuration
        run: nix eval --raw ".#homeConfigurations.sample-${{ matrix.system }}.activationPackage.drvPath"
